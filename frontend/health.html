<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>健康管理 - 猫咖管理系统</title>
<link rel="stylesheet" href="/css/style.css">
<script src="/js/api.js"></script>
<script src="/js/sidebar.js"></script>
</head>
<body>
<div class="layout">
<div class="sidebar" id="sidebar"></div>
<div class="main">
<div class="header"><div class="left"><span style="font-weight:600;color:#1890ff;">猫咖管理系统</span></div><div class="right"><span id="userInfo"></span></div></div>
<div class="content">
<div class="page-title">健康管理</div>
<div class="wf-toolbar"><div class="filters">
<select id="filterType" class="wf-select" onchange="loadHealth()"><option value="">全部类型</option><option value="vaccination">疑苗</option><option value="deworming">驱虫</option><option value="checkup">体检</option><option value="illness">生病</option><option value="surgery">手术</option></select>
</div></div>
<table class="wf-table"><thead><tr><th>猫咪ID</th><th>类型</th><th>日期</th><th>下次日期</th><th>详情</th></tr></thead>
<tbody id="healthList"></tbody></table>
<div class="mt-12 text-muted" id="healthFooter">加载中...</div>
</div></div></div>
<script>
const user = initPage();
const PAGES = [["\ud83d\udcca 仪表盘","/dashboard.html"],["\ud83d\udc31 猫咪管理","/cats.html"],["\ud83d\udc64 客户管理","/customers.html"],["\ud83d\udcb0 销售管理","/sales.html"],["\ud83d\udd21 健康管理","/health.html"],["\ud83d\udcc8 财务","/finance.html"],["\ud83c\udfea 分店管理","/branches.html"],["\ud83d\udc65 员工管理","/employees.html"],["\u2699 系统管理","/admin/"]];
buildSidebar(PAGES, 4);
async function loadHealth() {
    var t = document.getElementById("filterType").value;
    var url = "/health?merchant_id=" + (user.merchant_id||0);
    if (t) url += "&record_type=" + t;
    var r = await api(url);
    var tb = document.getElementById("healthList");
    if (r.code!==0||!r.data||!r.data.length) { tb.innerHTML = "<tr><td colspan=5 class='text-center text-muted' style='padding:20px'>暂无数据</td></tr>"; return; }
    tb.innerHTML = r.data.map(function(h){
        return "<tr><td>"+h.cat_id+"</td><td>"+h.record_type+"</td><td>"+h.record_date+"</td><td>"+s(h.next_date)+"</td><td>"+s(h.vaccine_type||h.deworming_type||h.notes)+"</td></tr>";
    }).join("");
}
loadHealth();
</script></body></html>
