<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>仪表盘 - 猫咖管理系统</title>
<link rel="stylesheet" href="/css/style.css">
<script src="/js/api.js"></script>
<script src="/js/sidebar.js"></script>
</head>
<body>
<div class="layout">
<div class="sidebar" id="sidebar"></div>
<div class="main">
<div class="header"><div class="left"><span style="font-weight:600;color:#1890ff;">猫咖管理系统</span><span style="color:#999;font-size:13px;margin-left:12px;">猫咪CRM管理系统</span></div><div class="right"><span id="userInfo"></span></div></div>
<div class="content">
<div class="page-title">仪表盘</div>
<div class="wf-grid wf-grid-4" id="stats"></div>
<div class="wf-grid-2" style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:20px;">
<div class="wf-card">
<div class="wf-card-title">近期待办</div>
<div id="pendingItems" style="font-size:13px;line-height:2.2;color:#666;">加载中...</div>
</div>
<div class="wf-card">
<div class="wf-card-title">快捷操作</div>
<div style="font-size:13px;line-height:2.2;color:#666;">
<a href="/cats.html" class="wf-btn primary small">猫咪管理</a>
<a href="/customers.html" class="wf-btn small">客户管理</a>
<a href="/sales.html" class="wf-btn small">销售管理</a>
<a href="/branches.html" class="wf-btn small">分店管理</a>
</div>
</div>
</div>
</div></div></div>
<script>
const user = initPage();
const PAGES = [
    ["\ud83d\udcca 仪表盘", "/dashboard.html"],
    ["\ud83d\udc31 猫咪管理", "/cats.html"],
    ["\ud83d\udc64 客户管理", "/customers.html"],
    ["\ud83d\udcb0 销售管理", "/sales.html"],
    ["\ud83d\udd21 健康管理", "/health.html"],
    ["\ud83d\udcc8 财务", "/finance.html"],
    ["\ud83c\udfea 分店管理", "/branches.html"],
    ["\ud83d\udc65 员工管理", "/employees.html"],
    ["\u2699 系统管理", "/admin/"],
];
buildSidebar(PAGES, 0);
async function loadStats() {
    const r = await api("/dashboard?merchant_id=" + (user.merchant_id || 0));
    if (r.code === 0) {
        const d = r.data;
        document.getElementById("stats").innerHTML =
            '<a href="/cats.html" class="wf-stat"><div class="num">' + (d.total_cats||0) + '</div><div class="label">猫咪总数</div></a>' +
            '<a href="/customers.html" class="wf-stat"><div class="num">' + (d.total_customers||0) + '</div><div class="label">客户总数</div></a>' +
            '<a href="/sales.html" class="wf-stat"><div class="num" style="color:#fa8c16;">' + (d.active_reservations||0) + '</div><div class="label">预订进行中</div></a>' +
            '<a href="/tasks.html" class="wf-stat"><div class="num" style="color:#52c41a;">' + (d.pending_tasks||0) + '</div><div class="label">待办任务</div></a>';
    }
    document.getElementById("pendingItems").innerHTML = '• <a href="/cats.html">查看猫咪列表</a><br>• <a href="/sales.html">查看销售记录</a>';
}
loadStats();
</script></body></html>
