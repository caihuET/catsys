<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>系统管理 - 猫咖管理系统</title>
<script src="/js/api.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,"Microsoft YaHei",sans-serif;background:#f0f2f5;color:#333;font-size:14px}
.layout{display:flex;min-height:100vh}
.sidebar{width:200px;background:#001529;color:#fff;flex-shrink:0}
.sidebar .logo{padding:16px;font-size:16px;font-weight:bold;border-bottom:1px solid rgba(255,255,255,0.1)}
.sidebar .logo span{color:#1890ff}
.sidebar a{display:block;padding:10px 16px;color:rgba(255,255,255,0.65);text-decoration:none;font-size:13px}
.sidebar a:hover,.sidebar a.active{background:rgba(255,255,255,0.08);color:#fff}
.main{flex:1;min-width:0}
.header{height:50px;background:#fff;border-bottom:1px solid #e8e8e8;display:flex;align-items:center;justify-content:space-between;padding:0 20px}
.content{padding:20px}
h2{font-size:18px;margin-bottom:16px;color:#333}
.card{background:#fff;border:1px solid #e8e8e8;border-radius:6px;padding:16px;margin-bottom:12px;max-width:700px}
.card h3{font-size:14px;color:#666;margin-bottom:12px;border-bottom:1px solid #f0f0f0;padding-bottom:8px}
.info-row{display:flex;justify-content:space-between;padding:6px 0;font-size:13px;border-bottom:1px solid #fafafa}
.info-row .label{color:#999}
.info-row .value{color:#333}
</style>
</head>
<body>
<div class="layout">
<div class="sidebar">
<div class="logo"><span>猫</span>咖管理系统</div>
<a href="/dashboard.html">仪表盘</a>
<a href="/cats.html">猫咪管理</a>
<a href="/customers.html">客户管理</a>
<a href="/admin/" class="active" style="margin-top:20px;border-top:1px solid rgba(255,255,255,0.1);padding-top:12px;">系统管理</a>
<a href="#" onclick="logout()">退出登录</a>
</div>
<div class="main">
<div class="header"><span></span><span id="userInfo"></span></div>
<div class="content">
<h2>系统管理</h2>
<div class="card"><h3>账户信息</h3>
<div class="info-row"><span class="label">手机号</span><span class="value" id="userPhone">-</span></div>
<div class="info-row"><span class="label">用户ID</span><span class="value" id="userId">-</span></div>
<div class="info-row"><span class="label">商家ID</span><span class="value" id="merchantId">-</span></div>
</div>
<div class="card"><h3>关于系统</h3>
<div class="info-row"><span class="label">系统名称</span><span class="value">猫咖管理系统</span></div>
<div class="info-row"><span class="label">版本</span><span class="value">v0.1</span></div>
<div class="info-row"><span class="label">API地址</span><span class="value">/cat/api</span></div>
</div>
</div></div></div>
<script>
const user = getUser();
if (!user) { window.location.href = "/"; }
document.getElementById("userInfo").textContent = user.phone;
document.getElementById("userPhone").textContent = user.phone || "-";
document.getElementById("userId").textContent = user.id || "-";
document.getElementById("merchantId").textContent = user.merchant_id || "-";
</script>
</body>
</html>
