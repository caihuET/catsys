<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>客户详情 - 猫咖管理系统</title>
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/css/style.css">
<script src="/js/api.js"></script>
<script src="/js/sidebar.js"></script>
<script src="/js/sidebar.js"></script>
<style>
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;background:#fff;padding:20px;border-radius:6px;border:1px solid #e8e8e8;max-width:700px}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:13px;color:#666;font-weight:500}
.required-star{color:#ff4d4f;margin-left:2px}
.field input,.field select,.field textarea{padding:7px 10px;border:1px solid #d9d9d9;border-radius:4px;font-size:13px;outline:none}
.field input:focus,.field select:focus{border-color:#1890ff}
.field textarea{min-height:60px;resize:vertical}
.actions{text-align:right;margin-top:16px}
.btn.disabled{opacity:0.5;cursor:not-allowed;pointer-events:none}
</style>
</head>
<body>
<div class="layout">
<div class="sidebar" id="sidebar"></div>
<div class="main">
<div class="header"><span></span><span id="userInfo"></span></div>
<div class="content">
<h2 id="pageTitle">新增客户</h2>
<div class="form-grid">
<div class="field"><label>姓名<span class="required-star">*</span></label><input id="name" required required placeholder="客户姓名"></div>
<div class="field"><label>手机号<span class="required-star">*</span></label><input id="phone" required required placeholder="手机号"></div>
<div class="field"><label>微信</label><input id="wechat" placeholder="微信号"></div>
<div class="field"><label>邮箱</label><input id="email" type="email" placeholder="邮箱"></div>
<div class="field"><label>来源</label><input id="source" placeholder="如：小红书"></div>
<div class="field"><label>状态</label><select id="status"><option value="lead">潜在</option><option value="interested">有意向</option><option value="contracted">已签约</option><option value="owner">已购买</option><option value="lost">已流失</option></select></div>
<div class="field"><label>偏好品种</label><input id="preferredBreeds" placeholder="如：布偶猫, 英短"></div>
<div class="field"><label>偏好颜色</label><input id="preferredColors" placeholder="如：蓝双, 金渐层"></div>
<div class="field"><label>预算下限(元)</label><input id="budgetMin" type="number" placeholder="0"></div>
<div class="field"><label>预算上限(元)</label><input id="budgetMax" type="number" placeholder="0"></div>
<div class="field" style="grid-column:1/-1"><label>地址</label><input id="address" placeholder="地址"></div>
<div class="field" style="grid-column:1/-1"><label>备注</label><textarea id="notes" placeholder="备注信息"></textarea></div>
</div>
<div class="actions">
<button class="btn btn-cancel" onclick="history.back()">取消</button>
<button class="btn" id="saveCustomerBtn" onclick="saveCustomer()">保存</button>
</div>
</div></div></div>
<script>
const user = initPage();
if (!user) { window.location.href = "/"; }
const PAGES = [["\ud83d\udcca \u4eea\u8868\u76d8", "/dashboard.html"],["\ud83d\udc31 \u732b\u54aa\u7ba1\u7406", "/cats.html"],["\ud83d\udc64 \u5ba2\u6237\u7ba1\u7406", "/customers.html"],["\ud83d\udcb0 \u9500\u552e\u7ba1\u7406", "/sales.html"],["\ud83d\udd21 \u5065\u5eb7\u7ba1\u7406", "/health.html"],["\ud83d\udcc8 \u8d22\u52a1", "/finance.html"],["\ud83c\udfea \u5206\u5e97\u7ba1\u7406", "/branches.html"],["\ud83d\udc65 \u5458\u5de5\u7ba1\u7406", "/employees.html"],["\u2699 \u7cfb\u7edf\u7ba1\u7406", "/admin/"]];
buildSidebar(PAGES, 2);
document.getElementById("userInfo").textContent = user.phone;
const params = new URLSearchParams(location.search);
const custId = params.get("id");
if (custId) { document.getElementById("pageTitle").textContent = "\u7f16\u8f91\u5ba2\u6237"; loadCustomer(custId); }
async function loadCustomer(id) {
    const r = await api("/customers/" + id + "?merchant_id=" + (user.merchant_id || 0));
    if (r.code !== 0) { alert("\u52a0\u8f7d\u5931\u8d25"); return; }
    const d = r.data;
    document.getElementById("name").value = d.name || "";
    document.getElementById("phone").value = d.phone || "";
    document.getElementById("wechat").value = d.wechat || "";
    document.getElementById("email").value = d.email || "";
    document.getElementById("source").value = d.source || "";
    document.getElementById("status").value = d.status || "lead";
    document.getElementById("preferredBreeds").value = d.preferred_breeds || "";
    document.getElementById("preferredColors").value = d.preferred_colors || "";
    document.getElementById("budgetMin").value = d.budget_min || "";
    document.getElementById("budgetMax").value = d.budget_max || "";
    document.getElementById("address").value = d.address || "";
    document.getElementById("notes").value = d.notes || "";
}

// 表单验证 - 必填字段控制
function checkForm() {
    var fields = ["name", "phone"];
    var allFilled = true;
    for (var i = 0; i < fields.length; i++) {
        var el = document.getElementById(fields[i]);
        if (!el || !el.value.trim()) { allFilled = false; break; }
    }
    var btn = document.getElementById("saveCustomerBtn");
    if (btn) {
        if (allFilled) {
            btn.classList.remove("disabled");
            btn.disabled = false;
        } else {
            btn.classList.add("disabled");
            btn.disabled = true;
        }
    }
    return allFilled;
}
// 为必填字段绑定输入事件
document.addEventListener("DOMContentLoaded", function() {
    var fields = ["name", "phone"];
    for (var i = 0; i < fields.length; i++) {
        var el = document.getElementById(fields[i]);
        if (el) el.addEventListener("input", checkForm);
    }
    checkForm();
});

function checkForm() {
    var fields = ["name", "phone"];
    for (var i = 0; i < fields.length; i++) {
        var el = document.getElementById(fields[i]);
        if (!el || !el.value.trim()) {
            document.getElementById("saveCustomerBtn").classList.add("disabled");
            document.getElementById("saveCustomerBtn").disabled = true;
            return false;
        }
    }
    document.getElementById("saveCustomerBtn").classList.remove("disabled");
    document.getElementById("saveCustomerBtn").disabled = false;
    return true;
}
(function() {
    var fields = ["name", "phone"];
    for (var i = 0; i < fields.length; i++) {
        var el = document.getElementById(fields[i]);
        if (el) el.addEventListener("input", checkForm);
    }
    checkForm();
})();
async function saveCustomer() {
    const br = await api("/branches?merchant_id=" + user.merchant_id);
    const branchId = (br.code === 0 && br.data && br.data.length > 0) ? br.data[0].id : 0;
    if (!checkForm()) { alert("请填写所有必填项"); return; }
    const body = {
        merchant_id: user.merchant_id || 0,
        branch_id: branchId,
        branch_id: branchId,
        name: document.getElementById("name").value,
        phone: document.getElementById("phone").value || null,
        wechat: document.getElementById("wechat").value || null,
        email: document.getElementById("email").value || null,
        source: document.getElementById("source").value || null,
        status: document.getElementById("status").value,
        preferred_breeds: document.getElementById("preferredBreeds").value || null,
        preferred_colors: document.getElementById("preferredColors").value || null,
        budget_min: parseFloat(document.getElementById("budgetMin").value) || null,
        budget_max: parseFloat(document.getElementById("budgetMax").value) || null,
        address: document.getElementById("address").value || null,
        notes: document.getElementById("notes").value || null,
    };
    const url = custId ? ("/customers/" + custId) : "/customers";
    const method = custId ? "PUT" : "POST";
    const r = await api(url, { method, body: JSON.stringify(body) });
    if (r.code === 0) {
        alert(custId ? "\u4fdd\u5b58\u6210\u529f" : "\u65b0\u589e\u6210\u529f");
        window.location.href = "/customers.html";
    } else {
        alert(r.detail || "\u64cd\u4f5c\u5931\u8d25");
    }
}
</script>
</body>
</html>
