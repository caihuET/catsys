const user = getUser();
if (!user) { window.location.href = "/"; }
document.getElementById("userInfo").textContent = user.phone;
const params = new URLSearchParams(location.search);
const custId = params.get("id");
if (custId) { document.getElementById("pageTitle").textContent = "????"; loadCustomer(custId); }

async function loadCustomer(id) {
    const r = await api("/customers/" + id + "?merchant_id=" + (user.merchant_id || 0));
    if (r.code !== 0) { alert("????"); return; }
    const d = r.data;
    document.getElementById("name").value = d.name || "";
    document.getElementById("phone").value = d.phone || "";
    document.getElementById("wechat").value = d.wechat || "";
    document.getElementById("email").value = d.email || "";
    document.getElementById("source").value = d.source || "";
    document.getElementById("status").value = d.status || "lead";
    document.getElementById("preferredBreeds").value = d.preferred_breeds || "";
    document.getElementById("preferredColors").value = d.preferred_colors || "";
    document.getElementById("budgetMin").value = d.budget_min || "";
    document.getElementById("budgetMax").value = d.budget_max || "";
    document.getElementById("address").value = d.address || "";
    document.getElementById("notes").value = d.notes || "";
}

async function saveCustomer() {
    const body = {
        merchant_id: user.merchant_id || 0,
        branch_id: 0,
        name: document.getElementById("name").value,
        phone: document.getElementById("phone").value || null,
        wechat: document.getElementById("wechat").value || null,
        email: document.getElementById("email").value || null,
        source: document.getElementById("source").value || null,
        status: document.getElementById("status").value,
        preferred_breeds: document.getElementById("preferredBreeds").value || null,
        preferred_colors: document.getElementById("preferredColors").value || null,
        budget_min: parseFloat(document.getElementById("budgetMin").value) || null,
        budget_max: parseFloat(document.getElementById("budgetMax").value) || null,
        address: document.getElementById("address").value || null,
        notes: document.getElementById("notes").value || null,
    };
    const url = custId ? ("/customers/" + custId) : "/customers";
    const method = custId ? "PUT" : "POST";
    const r = await api(url, { method, body: JSON.stringify(body) });
    if (r.code === 0) {
        alert(custId ? "????" : "????");
