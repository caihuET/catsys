<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>分店管理 - 猫咖管理系统</title>
<link rel="stylesheet" href="/css/style.css">
<script src="/js/api.js"></script>
<script src="/js/sidebar.js"></script>
</head>
<body>
<div class="layout">
<div class="sidebar" id="sidebar"></div>
<div class="main">
<div class="header"><div class="left"><span style="font-weight:600;color:#1890ff;">猫咖管理系统</span></div><div class="right"><span id="userInfo"></span></div></div>
<div class="content">
<div class="page-title">分店管理</div>
<div class="wf-toolbar"><div class="filters"></div><div><span class="wf-btn primary small" onclick="showAddModal()">+ 新增分店</span></div></div>
<table class="wf-table"><thead><tr><th>ID</th><th>名称</th><th>地址</th><th>电话</th><th>状态</th><th>操作</th></tr></thead>
<tbody id="branchList"></tbody></table>
<div class="mt-12 text-muted" id="branchFooter">加载中...</div>
</div></div></div>
<div class="wf-modal-overlay" id="addModal">
<div class="wf-modal">
<div class="wf-modal-header">新增分店</div>
<div class="wf-modal-body">
<div class="wf-form-row"><label>分店名称</label><input id="bName" class="wf-input" style="flex:1;" placeholder="请输入分店名称"></div>
<div class="wf-form-row"><label>地址</label><input id="bAddr" class="wf-input" style="flex:1;" placeholder="地址"></div>
<div class="wf-form-row"><label>联系电话</label><input id="bPhone" class="wf-input" style="flex:1;" placeholder="电话"></div>
<div class="wf-form-row"><label>状态</label><select id="bStatus" class="wf-select" style="flex:1;"><option value="active">营业中</option><option value="closed">已关闭</option></select></div>
</div>
<div class="wf-modal-footer"><span class="wf-btn" onclick="hideAddModal()">取消</span><span class="wf-btn primary" onclick="saveBranch()">保存</span></div>
</div></div>
<script>
const user = initPage();
const PAGES = [["\ud83d\udcca 仪表盘","/dashboard.html"],["\ud83d\udc31 猫咪管理","/cats.html"],["\ud83d\udc64 客户管理","/customers.html"],["\ud83d\udcb0 销售管理","/sales.html"],["\ud83d\udd21 健康管理","/health.html"],["\ud83d\udcc8 财务","/finance.html"],["\ud83c\udfea 分店管理","/branches.html"],["\ud83d\udc65 员工管理","/employees.html"],["\u2699 系统管理","/admin/"]];
buildSidebar(PAGES, 6);

let branchData = [];
let editingBranchId = null;
function showAddModal() { document.getElementById("addModal").classList.add("show"); }
function hideAddModal() { document.getElementById("addModal").classList.remove("show"); }
async function loadBranches() {
    var r = await api("/branches?merchant_id=" + (user.merchant_id||0));
    var tb = document.getElementById("branchList");
    if (r.code!==0||!r.data||!r.data.length) { tb.innerHTML = "<tr><td colspan=6 class='text-center text-muted' style='padding:20px'>暂无分店</td></tr>"; return; }
    branchData = r.data;
    tb.innerHTML = r.data.map(function(b){
        return "<tr><td>"+b.id+"</td><td>"+s(b.name)+"</td><td>"+s(b.address)+"</td><td>"+s(b.contact_phone)+"</td><td>"+(b.status==="active"?"营业中":"已关闭")+"</td><td><span class='wf-btn small' onclick='editBranchById("+b.id+")'>编辑</span> <span class='wf-btn small danger' onclick='if(confirm(\"确定删除\"))delBranch("+b.id+")'>删除</span></td></tr>";
    }).join("");
}
async function saveBranch() {
    var body = {
        merchant_id: user.merchant_id||0,
        name: document.getElementById("bName").value,
        address: document.getElementById("bAddr").value||null,
        contact_phone: document.getElementById("bPhone").value||null,
        status: document.getElementById("bStatus").value
    };
    if (!body.name) { alert("请输入分店名称"); return; }
    var r;
    if (editingBranchId) {
        r = await api("/branches/" + editingBranchId, {method:"PUT", body:JSON.stringify(body)});
    } else {
        r = await api("/branches", {method:"POST", body:JSON.stringify(body)});
    }
    if (r.code===0) {
        alert(editingBranchId ? "保存成功" : "新增成功");
        editingBranchId = null;
        document.querySelector(".wf-modal-header").textContent = "编辑分店";
        hideAddModal();
        loadBranches();
    } else {
        alert(r.detail||"失败");
    }
}
async function delBranch(id) {
    var r = await api("/branches/" + id, {method:"DELETE"});
    if (r.code===0) { loadBranches(); }
    else { alert(r.detail||"删除失败"); }
}
function editBranchById(id) {
    var b = branchData.find(function(item) { return item.id === id; });
    if (!b) { alert("未找到分店数据"); return; }
    editingBranchId = id;
    document.getElementById("bName").value = b.name;
    document.getElementById("bAddr").value = b.address || "";
    document.getElementById("bPhone").value = b.contact_phone || "";
    document.getElementById("bStatus").value = b.status || "active";
    document.querySelector(".wf-modal-header").textContent = "编辑分店";
    showAddModal();
}
loadBranches();
</script></body></html>
