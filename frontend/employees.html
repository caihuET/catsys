<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>员工管理 - 猫咖管理系统</title>
<link rel="stylesheet" href="/css/style.css">
<script src="/js/api.js"></script>
<script src="/js/sidebar.js"></script>
</head>
<body>
<div class="layout">
<div class="sidebar" id="sidebar"></div>
<div class="main">
<div class="header"><div class="left"><span style="font-weight:600;color:#1890ff;">猫咖管理系统</span></div><div class="right"><span id="userInfo"></span></div></div>
<div class="content">
<div class="page-title">员工管理</div>
<div class="wf-toolbar"><div class="filters"></div><div><span class="wf-btn primary small" onclick="showAddModal()">+ 添加员工</span></div></div>
<table class="wf-table"><thead><tr><th>ID</th><th>姓名</th><th>手机</th><th>角色</th><th>状态</th><th>操作</th></tr></thead>
<tbody id="empList"></tbody></table>
<div class="mt-12 text-muted" id="empFooter">加载中...</div>
</div></div></div>
<div class="wf-modal-overlay" id="addModal">
<div class="wf-modal">
<div class="wf-modal-header">添加员工</div>
<div class="wf-modal-body">
<div class="wf-form-row"><label>姓名 <span style="color:red;">*</span></label><input id="eName" class="wf-input" style="flex:1;" placeholder="输入姓名"></div>
<div class="wf-form-row"><label>手机号 <span style="color:red;">*</span></label><input id="ePhone" class="wf-input" style="flex:1;" placeholder="输入手机号"></div>
<div class="wf-form-row"><label>角色 <span style="color:red;">*</span></label><select id="eRole" class="wf-select" style="flex:1;"><option value="manager">店长</option><option value="sales">销售</option><option value="care_staff">护理员</option></select></div>
</div>
<div class="wf-modal-footer"><span class="wf-btn" onclick="hideAddModal()">取消</span><span class="wf-btn primary" onclick="saveEmployee()">保存</span></div>
</div></div>
<script>
const user = initPage();
const PAGES = [["\ud83d\udcca 仪表盘","/dashboard.html"],["\ud83d\udc31 猫咪管理","/cats.html"],["\ud83d\udc64 客户管理","/customers.html"],["\ud83d\udcb0 销售管理","/sales.html"],["\ud83d\udd21 健康管理","/health.html"],["\ud83d\udcc8 财务","/finance.html"],["\ud83c\udfea 分店管理","/branches.html"],["\ud83d\udc65 员工管理","/employees.html"],["\u2699 系统管理","/admin/"]];
buildSidebar(PAGES, 7);
function showAddModal() { document.getElementById("addModal").classList.add("show"); }
function hideAddModal() { document.getElementById("addModal").classList.remove("show"); }
async function loadEmployees() {
    var r = await api("/employees?merchant_id=" + (user.merchant_id||0));
    var tb = document.getElementById("empList");
    if (r.code!==0||!r.data||!r.data.length) { tb.innerHTML = "<tr><td colspan=6 class='text-center text-muted' style='padding:20px'>暂无员工</td></tr>"; return; }
    var roleMap = {manager:"店长",sales:"销售",care_staff:"护理员"};
    tb.innerHTML = r.data.map(function(e){
        return "<tr><td>"+e.id+"</td><td>"+s(e.name)+"</td><td>"+s(e.phone)+"</td><td>"+(roleMap[e.role_code]||e.role_code)+"</td><td>"+badge(e.status,{active:"green",disabled:"gray"})+"</td><td><span class='wf-btn small danger' onclick='if(confirm(\"确定\"))toggleEmp("+e.id+")'>"+(e.status==="active"?"禁用":"启用")+"</span></td></tr>";
    }).join("");
}
async function saveEmployee() {
    var body = {
        merchant_id: user.merchant_id||0, name: document.getElementById("eName").value,
        phone: document.getElementById("ePhone").value, role_code: document.getElementById("eRole").value
    };
    if (!body.name||!body.phone) { alert("请填写姓名和手机号"); return; }
    var r = await api("/employees", {method:"POST", body:JSON.stringify(body)});
    if (r.code===0) { alert("添加成功"); hideAddModal(); loadEmployees(); }
    else { alert(r.detail||"失败"); }
}
async function toggleEmp(id) {
    var r = await api("/employees/" + id + "/status", {method:"PUT"});
    if (r.code===0) { loadEmployees(); } else { alert(r.detail||"操作失败"); }
}
loadEmployees();
</script></body></html>
