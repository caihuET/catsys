<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>客户管理 - 猫咖管理系统</title>
<link rel="stylesheet" href="/css/style.css">
<script src="/js/api.js"></script>
<script src="/js/sidebar.js"></script>
</head>
<body>
<div class="layout">
<div class="sidebar" id="sidebar"></div>
<div class="main">
<div class="header"><div class="left"><span style="font-weight:600;color:#1890ff;">猫咖管理系统</span></div><div class="right"><span id="userInfo"></span></div></div>
<div class="content">
<div class="page-title">客户管理</div>
<div class="wf-toolbar">
<div class="filters">
<input id="search" class="wf-input" style="width:200px;" placeholder="搜索姓名/电话" oninput="loadCustomers()">
<select id="filter" class="wf-select" onchange="loadCustomers()"><option value="">全部状态</option><option value="lead">潜在</option><option value="interested">有意向</option><option value="contracted">已签约</option><option value="owner">已购买</option><option value="lost">已流失</option></select>
</div>
<div><a href="/customer-detail.html" class="wf-btn primary small">+ 新增客户</a></div>
</div>
<table class="wf-table"><thead><tr><th>姓名</th><th>电话</th><th>微信</th><th>来源</th><th>状态</th><th>偏好品种</th><th>操作</th></tr></thead>
<tbody id="customerList"></tbody></table>
<div class="mt-12 text-muted" id="custFooter">加载中...</div>
</div></div></div>
<script>
const user = initPage();
const PAGES = [["\ud83d\udcca 仪表盘","/dashboard.html"],["\ud83d\udc31 猫咪管理","/cats.html"],["\ud83d\udc64 客户管理","/customers.html"],["\ud83d\udcb0 销售管理","/sales.html"],["\ud83d\udd21 健康管理","/health.html"],["\ud83d\udcc8 财务","/finance.html"],["\ud83c\udfea 分店管理","/branches.html"],["\ud83d\udc65 员工管理","/employees.html"],["\u2699 系统管理","/admin/"]];
buildSidebar(PAGES, 2);
async function loadCustomers() {
    const s = document.getElementById("search").value;
    const f = document.getElementById("filter").value;
    let url = "/customers?merchant_id=" + (user.merchant_id || 0);
    if (s) url += "&search=" + s;
    if (f) url += "&status=" + f;
    const r = await api(url);
    const tb = document.getElementById("customerList");
    if (r.code !== 0 || !r.data || !r.data.length) { tb.innerHTML = "<tr><td colspan=7 class='text-center text-muted' style='padding:20px'>暂无数据</td></tr>"; document.getElementById("custFooter").textContent = "共 0 条"; return; }
    var clsMap = {owner:"green",interested:"blue",contracted:"orange",lead:"gray",lost:"red"};
    tb.innerHTML = r.data.map(function(c) {
        return "<tr><td>" + s(c.name) + "</td><td>" + s(c.phone) + "</td><td>" + s(c.wechat) + "</td><td>" + s(c.source) + "</td><td>" + badge(c.status, clsMap) + "</td><td>" + s(c.preferred_breeds) + "</td><td><a href='/customer-detail.html?id=" + c.id + "' class='wf-btn small'>编辑</a></td></tr>";
    }).join("");
    document.getElementById("custFooter").textContent = "共 " + r.data.length + " 条";
}
loadCustomers();
</script></body></html>
