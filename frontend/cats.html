<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>猫咪管理 - 猫咖管理系统</title>
<link rel="stylesheet" href="/css/style.css">
<script src="/js/api.js"></script>
<script src="/js/sidebar.js"></script>
</head>
<body>
<div class="layout">
<div class="sidebar" id="sidebar"></div>
<div class="main">
<div class="header"><div class="left"><span style="font-weight:600;color:#1890ff;">猫咖管理系统</span></div><div class="right"><span id="userInfo"></span></div></div>
<div class="content">
<div class="page-title">猫咪管理</div>
<div class="wf-toolbar">
<div class="filters">
<input id="search" class="wf-input" style="width:160px;" placeholder="搜索名字/芯片号" oninput="loadCats()">
<select id="filterBreed" class="wf-select" onchange="loadCats()"><option value="">全部品种</option></select>
<select id="filterStatus" class="wf-select" onchange="loadCats()"><option value="">全部状态</option><option value="available">在售</option><option value="reserved">已预订</option><option value="sold">已售</option><option value="fostering">寄养</option><option value="retired">退役</option></select>
</div>
<div><a href="/cat-detail.html" class="wf-btn primary small">+ 新增猫咪</a></div>
</div>
<table class="wf-table"><thead><tr><th>名字</th><th>品种</th><th>毛色</th><th>性别</th><th>年龄</th><th>状态</th><th>价格</th><th>操作</th></tr></thead>
<tbody id="catList"></tbody></table>
<div class="mt-12 text-muted" id="catFooter">加载中...</div>
</div></div></div>
<script>
const user = initPage();
const PAGES = [["\ud83d\udcca 仪表盘","/dashboard.html"],["\ud83d\udc31 猫咪管理","/cats.html"],["\ud83d\udc64 客户管理","/customers.html"],["\ud83d\udcb0 销售管理","/sales.html"],["\ud83d\udd21 健康管理","/health.html"],["\ud83d\udcc8 财务","/finance.html"],["\ud83c\udfea 分店管理","/branches.html"],["\ud83d\udc65 员工管理","/employees.html"],["\u2699 系统管理","/admin/"]];
buildSidebar(PAGES, 1);
async function loadCats() {
    const q = document.getElementById("search").value;
    const st = document.getElementById("filterStatus").value;
    let url = "/cats?merchant_id=" + (user.merchant_id || 0);
    if (q) url += "&search=" + s;
    if (st) url += "&status=" + st;
    const r = await api(url);
    const tb = document.getElementById("catList");
    if (r.code !== 0 || !r.data || !r.data.length) { tb.innerHTML = "<tr><td colspan=8 class='text-center text-muted' style='padding:20px;'>暂无数据</td></tr>"; document.getElementById("catFooter").textContent = "共 0 条"; return; }
    tb.innerHTML = r.data.map(function(c) {
        var a = c.age_days ? Math.floor(c.age_days/365) + "Y" : "-";
        var cls = {available:"green",reserved:"blue",sold:"gray",fostering:"orange",retired:"gray"}[c.status] || "gray";
        return "<tr><td>" + s(c.name) + "</td><td>" + s(c.breed) + "</td><td>" + s(c.color) + "</td><td>" + s(c.gender) + "</td><td>" + a + "</td><td><span class='wf-badge " + cls + "'>" + c.status + "</span></td><td>" + (c.price ? "¥" + c.price : "-") + "</td><td><a href='/cat-detail.html?id=" + c.id + "' class='wf-btn small'>编辑</a></td></tr>";
    }).join("");
    document.getElementById("catFooter").textContent = "共 " + r.data.length + " 条";
}
loadCats();
</script></body></html>
