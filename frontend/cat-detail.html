<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>猫咪详情 - 猫咖管理系统</title>
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/css/style.css">
<script src="/js/api.js"></script>
<script src="/js/sidebar.js"></script>
<script src="/js/sidebar.js"></script>
<style>
.form-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;background:#fff;padding:20px;border-radius:6px;border:1px solid #e8e8e8}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:13px;color:#666;font-weight:500}
.required-star{color:#ff4d4f;margin-left:2px}
.field input,.field select,.field textarea{padding:7px 10px;border:1px solid #d9d9d9;border-radius:4px;font-size:13px;outline:none}
.field input:focus,.field select:focus{border-color:#1890ff}
.field textarea{min-height:60px;resize:vertical}
.actions{text-align:right;margin-top:16px}
.btn.disabled{opacity:0.5;cursor:not-allowed;pointer-events:none}
</style>
</head>
<body>
<div class="layout">
<div class="sidebar" id="sidebar"></div>
<div class="main">
<div class="header"><span></span><span id="userInfo"></span></div>
<div class="content">
<h2 id="pageTitle">新增猫咪</h2>
<div class="form-grid" id="catForm">
<div class="field"><label>名称<span class="required-star">*</span></label><input id="name" required required placeholder="猫咪名称"></div>
<div class="field"><label>品种<span class="required-star">*</span></label><input id="breed" required required placeholder="如：布偶猫"></div>
<div class="field"><label>毛色</label><input id="color" placeholder="如：蓝双"></div>
<div class="field"><label>性别<span class="required-star">*</span></label><select id="gender" required required><option value="">请选择</option><option value="male">公</option><option value="female">母</option></select></div>
<div class="field"><label>生日</label><input id="birthDate" type="date"></div>
<div class="field"><label>到店日期<span class="required-star">*</span></label><input id="arrivalDate" required required type="date"></div>
<div class="field"><label>芯片号</label><input id="microchip" placeholder="芯片编号"></div>
<div class="field"><label>血统号</label><input id="pedigree" placeholder="血统证书编号"></div>
<div class="field"><label>状态</label><select id="status"><option value="available">在售</option><option value="reserved">已预订</option><option value="sold">已售</option><option value="fostering">寄养</option><option value="retired">退役</option></select></div>
<div class="field"><label>售价(元)</label><input id="price" type="number" placeholder="0"></div>
<div class="field" style="grid-column:1/-1"><label>备注</label><textarea id="notes" placeholder="备注信息"></textarea></div>
</div>
<div class="actions">
<button class="btn btn-cancel" onclick="history.back()">取消</button>
<button class="btn" id="saveCatBtn" onclick="saveCat()">保存</button>
</div>
</div></div></div>
<script>
const user = initPage();
if (!user) { window.location.href = "/"; }
const PAGES = [["\ud83d\udcca \u4eea\u8868\u76d8", "/dashboard.html"],["\ud83d\udc31 \u732b\u54aa\u7ba1\u7406", "/cats.html"],["\ud83d\udc64 \u5ba2\u6237\u7ba1\u7406", "/customers.html"],["\ud83d\udcb0 \u9500\u552e\u7ba1\u7406", "/sales.html"],["\ud83d\udd21 \u5065\u5eb7\u7ba1\u7406", "/health.html"],["\ud83d\udcc8 \u8d22\u52a1", "/finance.html"],["\ud83c\udfea \u5206\u5e97\u7ba1\u7406", "/branches.html"],["\ud83d\udc65 \u5458\u5de5\u7ba1\u7406", "/employees.html"],["\u2699 \u7cfb\u7edf\u7ba1\u7406", "/admin/"]];
buildSidebar(PAGES, 1);
document.getElementById("userInfo").textContent = user.phone;
const params = new URLSearchParams(location.search);
const catId = params.get("id");
if (catId) { document.getElementById("pageTitle").textContent = "\u7f16\u8f91\u732b\u54aa"; loadCat(catId); }

async function loadCat(id) {
    const r = await api("/cats/" + id + "?merchant_id=" + (user.merchant_id || 0));
    if (r.code !== 0) { alert("\u52a0\u8f7d\u5931\u8d25"); return; }
    const d = r.data;
    document.getElementById("name").value = d.name || "";
    document.getElementById("breed").value = d.breed || "";
    document.getElementById("color").value = d.color || "";
    document.getElementById("gender").value = d.gender || "";
    document.getElementById("birthDate").value = d.birth_date ? d.birth_date.substring(0,10) : "";
    document.getElementById("arrivalDate").value = d.arrival_date ? d.arrival_date.substring(0,10) : "";
    document.getElementById("microchip").value = d.microchip_number || "";
    document.getElementById("pedigree").value = d.pedigree_number || "";
    document.getElementById("status").value = d.status || "available";
    document.getElementById("price").value = d.price || "";
    document.getElementById("notes").value = d.notes || "";
}


// 表单验证 - 必填字段控制
function checkForm() {
    var fields = ["name", "breed", "gender", "arrivalDate"];
    var allFilled = true;
    for (var i = 0; i < fields.length; i++) {
        var el = document.getElementById(fields[i]);
        if (!el || !el.value.trim()) { allFilled = false; break; }
    }
    var btn = document.getElementById("saveCatBtn");
    if (btn) {
        if (allFilled) {
            btn.classList.remove("disabled");
            btn.disabled = false;
        } else {
            btn.classList.add("disabled");
            btn.disabled = true;
        }
    }
    return allFilled;
}
// 为必填字段绑定输入事件
document.addEventListener("DOMContentLoaded", function() {
    var fields = ["name", "breed", "gender", "arrivalDate"];
    for (var i = 0; i < fields.length; i++) {
        var el = document.getElementById(fields[i]);
        if (el) el.addEventListener("input", checkForm);
    }
    checkForm();
});

function checkForm() {
    var fields = ["name", "breed", "gender", "arrivalDate"];
    for (var i = 0; i < fields.length; i++) {
        var el = document.getElementById(fields[i]);
        if (!el || !el.value.trim()) {
            document.getElementById("saveCatBtn").classList.add("disabled");
            document.getElementById("saveCatBtn").disabled = true;
            return false;
        }
    }
    document.getElementById("saveCatBtn").classList.remove("disabled");
    document.getElementById("saveCatBtn").disabled = false;
    return true;
}
(function() {
    var fields = ["name", "breed", "gender", "arrivalDate"];
    for (var i = 0; i < fields.length; i++) {
        var el = document.getElementById(fields[i]);
        if (el) el.addEventListener("input", checkForm);
    }
    checkForm();
})();
async function saveCat() {
    try {
        const br = await api("/branches?merchant_id=" + user.merchant_id);
    const branchId = (br.code === 0 && br.data && br.data.length > 0) ? br.data[0].id : 0;
    if (!checkForm()) { alert("请填写所有必填项"); return; }
    const body = {
        merchant_id: user.merchant_id || 0,
        branch_id: branchId,
        branch_id: branchId,
        name: document.getElementById("name").value,
        breed: document.getElementById("breed").value || null,
        color: document.getElementById("color").value || null,
        gender: document.getElementById("gender").value || null,
        birth_date: document.getElementById("birthDate").value || null,
        arrival_date: document.getElementById("arrivalDate").value || null,
        microchip_number: document.getElementById("microchip").value || null,
        pedigree_number: document.getElementById("pedigree").value || null,
        status: document.getElementById("status").value,
        price: parseFloat(document.getElementById("price").value) || null,
        notes: document.getElementById("notes").value || null,
        };
        const url = catId ? ("/cats/" + catId) : "/cats";
        const method = catId ? "PUT" : "POST";
        const r = await api(url, { method, body: JSON.stringify(body) });
        if (r.code === 0) {
        alert(catId ? "\u4fdd\u5b58\u6210\u529f" : "\u65b0\u589e\u6210\u529f");
        window.location.href = "/cats.html";
        } else {
        alert(r.detail || "\u64cd\u4f5c\u5931\u8d25");
        }
    } catch(e) {
        console.error("saveCat error:", e);
        alert("网络请求失败：" + e.message);
    }
}
</script>
</body>
</html>
